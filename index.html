                        state.drag.target = oil;
                        state.drag.offsetX = pos.x - oil.x;
                        state.drag.offsetY = pos.y - oil.y;
                        canvas.style.cursor = 'grabbing';
                        return;
                    }
                }
            }

            // שלב 3: בדיקה אם נלחצה מיצלה (ניתנת להזזה אך לא לפירוק)
            if (state.currentStage === 3) {
                for (let i = state.micelles.length - 1; i >= 0; i--) {
                    const m = state.micelles[i];
                    if (distSq(pos.x, pos.y, m.x, m.y) <= m.outerRadius * m.outerRadius) {
                        state.drag.active = true;
                        state.drag.type = 'micelle';
                        state.drag.target = m;
                        state.drag.offsetX = pos.x - m.x;
                        state.drag.offsetY = pos.y - m.y;
                        canvas.style.cursor = 'grabbing';
                        return;
                    }
                }
            }

            // שלב 2: בדיקה אם נלחצה מולקולת חפ"ש (ראש או זנב)
            if (state.currentStage === 2) {
                for (let i = state.surfactants.length - 1; i >= 0; i--) {
                    const s = state.surfactants[i];
                    const g = getSurfactantGeometry(s);

                    const dHead = Math.hypot(pos.x - g.headX, pos.y - g.headY);
                    const cp = closestPointOnSegment(pos.x, pos.y, g.headX, g.headY, g.tailTipX, g.tailTipY);
                    const dTail = Math.hypot(pos.x - cp.x, pos.y - cp.y);

                    if (dHead <= CONFIG.SURF_HEAD_RADIUS + 8 || dTail <= 16) {
                        state.drag.active = true;
                        state.drag.type = 'surfactant';
                        state.drag.target = s;
                        state.drag.offsetX = pos.x - s.x;
                        state.drag.offsetY = pos.y - s.y;

                        // שמירת נקודת האחיזה במערכת הצירים המקומית של המולקולה לצורך סיבוב
                        const dx = pos.x - s.x;
                        const dy = pos.y - s.y;
                        const cos = Math.cos(-s.angle);
                        const sin = Math.sin(-s.angle);
                        state.drag.grabLocalX = dx * cos - dy * sin;
                        state.drag.grabLocalY = dx * sin + dy * cos;

                        canvas.style.cursor = 'grabbing';
                        return;
                    }
                }
            }
        }

        function handlePointerMove(evt) {
            if (!state.isRunning || state.isStageEnded) {
                canvas.style.cursor = 'default';
                return;
            }
            const pos = getPointerPos(evt);
            state.drag.pointerX = pos.x;
            state.drag.pointerY = pos.y;

            if (state.drag.active) {
                evt.preventDefault();
                return;
            }

            // עדכון סמן העכבר בריחוף מעל עצם ניתן לגרירה
            let hoveringDraggable = false;
            if (state.currentStage === 1 || state.currentStage === 3) {
                for (const oil of state.oils) {
                    if (distSq(pos.x, pos.y, oil.x, oil.y) <= oil.r * oil.r) {
                        hoveringDraggable = true;
                        break;
                    }
                }
            }
            if (!hoveringDraggable && state.currentStage === 3) {
                for (const m of state.micelles) {
                    if (distSq(pos.x, pos.y, m.x, m.y) <= m.outerRadius * m.outerRadius) {
                        hoveringDraggable = true;
                        break;
                    }
                }
            }
            if (!hoveringDraggable && state.currentStage === 2) {
                for (const s of state.surfactants) {
                    const g = getSurfactantGeometry(s);
                    const cp = closestPointOnSegment(pos.x, pos.y, g.headX, g.headY, g.tailTipX, g.tailTipY);
                    if (Math.hypot(pos.x - cp.x, pos.y - cp.y) <= 22) {
                        hoveringDraggable = true;
                        break;
                    }
                }
            }
            canvas.style.cursor = hoveringDraggable ? 'grab' : 'default';
        }

        function handlePointerUp() {
            state.drag.active = false;
            state.drag.target = null;
            state.drag.type = null;
            canvas.style.cursor = 'default';
        }

        canvas.addEventListener('mousedown', handlePointerDown);
        window.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mouseup', handlePointerUp);

        canvas.addEventListener('touchstart', handlePointerDown, { passive: false });
        window.addEventListener('touchmove', handlePointerMove, { passive: false });
        window.addEventListener('touchend', handlePointerUp);

        // ==========================================
        // 12. ניהול שלבים, טיימר וממשק משתמש (UI)
        // ==========================================
        function formatTime(seconds) {
            const s = Math.max(0, Math.ceil(seconds));
            const mins = Math.floor(s / 60);
            const secs = s % 60;
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function updateTimerUI() {
            timerDisplay.textContent = formatTime(state.timeRemaining);
            if (state.timeRemaining <= 15 && state.isRunning && !state.isStageEnded) {
                timerDisplay.className = 'text-xl md:text-2xl font-bold text-rose-600 tabular-nums animate-pulse';
            } else {
                timerDisplay.className = 'text-xl md:text-2xl font-bold text-sky-700 tabular-nums';
            }
        }

        function updateSidebarUI() {
            // החזרת תיבת ההנחיות למצב צבע רגיל (למקרה שהשתנה לירוק בניצחון)
            const instrBox = instructionText.parentElement;
            instrBox.className = "mt-3 bg-amber-50/90 border border-amber-200/90 rounded-xl p-3 transition-colors duration-500";
            instrBox.querySelector('div').className = "flex items-center gap-1.5 text-amber-800 font-semibold text-xs mb-1";
            instrBox.querySelector('div').innerHTML = `<svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg><span>הנחיות למשימה</span>`;
            
            instructionText.className = "text-sm font-medium text-slate-800 leading-snug";
            instructionText.textContent = STAGE_INSTRUCTIONS[state.currentStage] || STAGE_INSTRUCTIONS[0];
            
            doneBtn.disabled = !(state.isRunning && !state.isStageEnded);

            for (let i = 0; i < 3; i++) {
                const stageNum = i + 1;
                const btn = stageBtns[i];
                const icon = stageIcons[i];
                const res = stageResults[i];
                const unlocked = state.unlockedStages[i];
                const savedScore = state.stageScores[i];
                const isCurrent = state.currentStage === stageNum;

                btn.disabled = !unlocked;

                if (!unlocked) {
                    btn.className = 'stage-btn flex-1 py-2.5 px-3 rounded-xl text-right font-semibold text-sm border transition-all flex items-center justify-between bg-slate-100 text-slate-400 border-slate-200 cursor-not-allowed';
                    icon.textContent = '🔒';
                    icon.className = 'text-xs';
                } else if (isCurrent && state.isRunning) {
                    btn.className = 'stage-btn flex-1 py-2.5 px-3 rounded-xl text-right font-semibold text-sm border transition-all cursor-pointer flex items-center justify-between bg-sky-600 text-white border-sky-700 shadow-md ring-2 ring-sky-300';
                    icon.textContent = 'פעיל';
                    icon.className = 'text-xs bg-white/25 px-2 py-0.5 rounded-full';
                } else {
                    btn.className = 'stage-btn flex-1 py-2.5 px-3 rounded-xl text-right font-semibold text-sm border transition-all cursor-pointer flex items-center justify-between bg-white hover:bg-sky-50 text-slate-800 border-slate-300 shadow-sm';
                    icon.textContent = savedScore !== null ? 'שחק שוב' : 'התחל';
                    icon.className = 'text-xs bg-sky-100 text-sky-800 px-2 py-0.5 rounded-full';
                }

                // תצוגת תוצאה סופית ליד כפתור השלב
                if (savedScore !== null) {
                    const formattedScore = Number.isInteger(savedScore) ? savedScore : savedScore.toFixed(1);
                    res.textContent = `תוצאה: ${formattedScore}`;
                    if (savedScore >= 0) {
                        res.className = 'min-w-[86px] text-center text-xs font-bold px-2 py-2 rounded-xl bg-emerald-50 text-emerald-700 border border-emerald-200';
                    } else {
                        res.className = 'min-w-[86px] text-center text-xs font-bold px-2 py-2 rounded-xl bg-amber-50 text-amber-800 border border-amber-200';
                    }
                } else {
                    res.textContent = 'טרם הושלם';
                    res.className = 'min-w-[86px] text-center text-xs font-medium px-2 py-2 rounded-xl bg-slate-100 text-slate-400 border border-slate-200';
                }
            }
        }

        // התחלת שלב נבחר
        function startStage(stageNum) {
            if (!state.unlockedStages[stageNum - 1]) return;

            state.currentStage = stageNum;
            state.isRunning = true;
            state.isStageEnded = false;
            state.stage3Won = false;
            state.particles = [];
            state.timeRemaining = CONFIG.STAGE_DURATION;
            state.drag.active = false;
            state.drag.target = null;

            // הסרת מצב החשכה מהקנבס
            canvas.classList.remove('stage-ended');

            if (stageNum === 1) initStage1();
            else if (stageNum === 2) initStage2();
            else if (stageNum === 3) initStage3();

            updateTimerUI();
            updateSidebarUI();
        }

        // סיום שלב (כאשר הזמן נגמר או בלחיצה על "סיום שלב")
        function finishCurrentStage() {
            if (!state.isRunning || state.isStageEnded) return;

            state.isRunning = false;
            state.isStageEnded = true;
            state.drag.active = false;
            state.drag.target = null;

            // הקפאת הלוח והחשכה עדינה של הקנבס ללא שום טקסט או חלונית על גבי הקנבס
            canvas.classList.add('stage-ended');

            // שמירת התוצאה הסופית ליד כפתור השלב
            const idx = state.currentStage - 1;
            state.stageScores[idx] = state.currentScore;

            // פתיחת השלב הבא אם קיים
            if (state.currentStage === 1) {
                state.unlockedStages[1] = true;
            } else if (state.currentStage === 2) {
                state.unlockedStages[2] = true;
            }

            updateTimerUI();
            updateSidebarUI();
        }

        // איפוס מלא של המשחק
        function resetEntireGame() {
            state.currentStage = 0;
            state.isRunning = false;
            state.isStageEnded = false;
            state.stage3Won = false;
            state.unlockedStages = [true, false, false];
            state.stageScores = [null, null, null];
            state.currentScore = 0;
            state.timeRemaining = CONFIG.STAGE_DURATION;
            state.drag.active = false;
            state.drag.target = null;
            state.particles = [];

            canvas.classList.remove('stage-ended');
            buildIdlePreviewBoard();
            renderScoreText();
            updateTimerUI();
            updateSidebarUI();
        }

        // חיבור מאזינים לכפתורים
        stageBtns.forEach((btn, idx) => {
            btn.addEventListener('click', () => startStage(idx + 1));
        });
        doneBtn.addEventListener('click', finishCurrentStage);
        resetBtn.addEventListener('click', resetEntireGame);

        // ==========================================
        // 13. לולאת אנימציה ראשית (60fps)
        // ==========================================
        function gameLoop(timestamp) {
            if (!state.lastFrameTime) state.lastFrameTime = timestamp;
            const dt = Math.min((timestamp - state.lastFrameTime) / 1000, 0.05);
            state.lastFrameTime = timestamp;

            if (state.isRunning && !state.isStageEnded) {
                // עדכון טיימר ספירה לאחור
                state.timeRemaining -= dt;
                if (state.timeRemaining <= 0) {
                    state.timeRemaining = 0;
                    updateTimerUI();
                    finishCurrentStage();
                } else {
                    updateTimerUI();
                }

                // הרצת הפיזיקה
                stepPhysics(dt);
            }

            // עדכון חלקיקים תמיד כדי שהזיקוקים יסיימו את האנימציה גם אם השלב נגמר
            updateParticles();
            
            // ציור הלוח בכל פריים
            drawScene();
            
            requestAnimationFrame(gameLoop);
        }

        // אתחול ראשוני בעליית העמוד
        window.onload = function () {
            resizeCanvas();
            resetEntireGame();
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
